<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Architecture Tools</title>
<meta name="description" content="Free web tools for architectural designers and students &mdash; the tedious little things, without the paid subscription.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 72px 40px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 30px;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.5px;
  }
  p.sub {
    margin: 0 0 88px;
    max-width: 46ch;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    color: #000000;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 260px);
    grid-auto-rows: 140px;
    column-gap: 44px;
    row-gap: 40px;
  }
  @media (max-width: 620px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
  .tool {
    border: 3px solid #000000;
    background: #ffffff;
    color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 18px;
    line-height: 1.3;
    text-decoration: none;
    padding: 12px;
  }
  .tool:hover {
    background: #000000;
    color: #ffffff;
  }
  .tool.placeholder {
    color: #000000;
    cursor: default;
  }
  .tool.placeholder:hover {
    background: #ffffff;
    color: #000000;
  }
  footer {
    margin-top: 100px;
    font-size: 13px;
    color: #000000;
    text-align: center;
  }
  footer a { color: #000000; }
</style>
</head>
<body>
<div class="wrap">

  <h1>free architecture tools</h1>
  <p class="sub">Little tedious things architects do all the time, made free. No subscriptions.</p>

  <div class="grid">
    <a class="tool" href="tools/base-cabinet-run/">Base Cabinet<br>Run Calculator</a>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
    <span class="tool placeholder">tool</span>
  </div>

  <footer>more tools coming soon</footer>

</div>
</body>
</html>
